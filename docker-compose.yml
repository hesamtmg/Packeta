# Brings up the whole Packeta stack: two Postgres databases (Packeta's own
# backend, and the standalone sandbox IPG it calls out to), Mongo (Packeta's
# transaction-log store) with a mongo-express web UI in front of it, all four
# apps (backend, ipg-backend, frontend, ipg-frontend), and an nginx reverse
# proxy that's the only public entry point, terminating TLS for two domains:
#
#   packeta.ir      -> frontend (wallet app), packeta.ir/api      -> backend
#   pay.packeta.ir  -> ipg-frontend (pay page), pay.packeta.ir/api -> ipg-backend
#
# None of the app containers publish ports to the host anymore — nginx is
# the only thing reachable from outside, proxying to each container by its
# service name over the internal compose network. See deploy/README.md for
# the full setup (DNS, first-time TLS via deploy/docker/init-letsencrypt.sh,
# renewals).
#
# Just want it running locally, no domain or certificate involved? Use
# docker-compose.dev.yml instead — see its header comment or the "Local
# development" section of deploy/README.md.
#
# Five things worth knowing:
#   1. WALLET_DOMAIN / PAY_DOMAIN (defaults: packeta.ir / pay.packeta.ir)
#      drive both nginx's server_name/cert paths and the browser-facing URLs
#      baked into the backends' env and the frontends' VITE_* build args.
#      Override them in a root .env file to deploy under different domains.
#   2. VITE_* values are baked into the frontend bundles at *build* time
#      (Vite inlines import.meta.env.VITE_*), so changing WALLET_DOMAIN/
#      PAY_DOMAIN requires a rebuild (`docker compose up --build`), not just
#      a container restart.
#   3. mongo-express (http://<server-ip>:8081, basic auth admin/admin by
#      default) is a browsing UI only — nothing writes through it. The
#      backend is still the only thing that writes to `packeta_logs`
#      (see MONGO_URI on the backend service below).
#   4. mem_limit on every service is sized for a small (~4GB RAM) box —
#      remove them (or raise the numbers) if you have more headroom.
#   5. TLS certs live under ./deploy/certbot/ as a bind mount (not a named
#      volume) so deploy/docker/init-letsencrypt.sh and renewals can touch
#      the files directly. That directory holds real private keys — it's
#      gitignored, keep it that way.
#
# Real secrets (JWT_SECRET, a real ZARINPAL_MERCHANT_ID, mongo-express
# credentials, LETSENCRYPT_EMAIL, etc.) can be supplied via a .env file at
# the repo root — see the ${VAR:-default} fallbacks below — without editing
# this file.

services:
  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    mem_limit: 384m
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - max_connections=50
    environment:
      POSTGRES_USER: hesamtmg
      POSTGRES_PASSWORD: Tmg@2215309
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U packeta']
      interval: 5s
      timeout: 5s
      retries: 10

  ipg-postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    mem_limit: 256m
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
    environment:
      POSTGRES_USER: hesamtmg
      POSTGRES_PASSWORD: Tmg@2215309
      POSTGRES_DB: packeta_ipg
    volumes:
      - ipg_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ipg']
      interval: 5s
      timeout: 5s
      retries: 10

  # No host port published: nothing outside the docker network needs to
  # reach Mongo directly — the backend talks to it over the internal
  # network, and mongo-express (below) covers browsing it from a browser.
  # Publishing 27017 straight onto a public server's IP would put an
  # unauthenticated database port on the open internet.
  mongo:
    image: mongo:7
    restart: unless-stopped
    mem_limit: 384m
    command: ['mongod', '--wiredTigerCacheSizeGB', '0.25']
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand("ping")']
      interval: 5s
      timeout: 5s
      retries: 10

  # Web UI for browsing Mongo — mainly for the backend's `packeta_logs`
  # database (see MONGO_URI below), the one place its Mongo-side data
  # actually lives. Login is HTTP basic auth (defaults below); open
  # http://<server-ip>:8081, then pick "packeta_logs" from the database
  # list once the backend has written at least one log entry. Deliberately
  # left outside the nginx/TLS setup — it's an admin-only tool, not part of
  # either public domain.
  mongo-express:
    image: mongo-express:1-20-alpine3.19
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-admin}
    ports:
      - '8081:8081'

  # The standalone sandbox IPG — a real external-looking payment gateway
  # backend's PURCHASE/installment-repayment flow calls out to. Not
  # published to the host; reachable only via nginx (pay.packeta.ir/api)
  # or, server-to-server, via the backend service below.
  ipg-backend:
    build:
      context: ./ipg-backend
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      ipg-postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: ipg-postgres
      DB_PORT: 5432
      DB_USERNAME: hesamtmg
      DB_PASSWORD: Tmg@2215309
      DB_DATABASE: packeta_ipg
      IPG_API_KEY: ${IPG_API_KEY:-sandbox-ipg-key}
      # Browser-facing — where a merchant's charge redirects the customer
      # to pay.
      IPG_FRONTEND_URL: https://${PAY_DOMAIN:-pay.packeta.ir}

  # Packeta's own backend. Not published to the host; reachable only via
  # nginx (packeta.ir/api).
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: hesamtmg
      DB_PASSWORD: Tmg@2215309
      DB_DATABASE: postgres
      MONGO_URI: mongodb://mongo:27017/packeta_logs
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      # Server-to-server (purchase initiate/verify) — internal docker
      # network hostname, unaffected by the public domains below.
      IPG_BASE_URL: http://ipg-backend:4000
      IPG_API_KEY: ${IPG_API_KEY:-sandbox-ipg-key}
      # ZarinPal's public sandbox — settles no real money, accepts any
      # well-formed merchant id. Point both at production to go live.
      ZARINPAL_BASE_URL: ${ZARINPAL_BASE_URL:-https://sandbox.zarinpal.com}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx}
      # Browser-facing.
      FRONTEND_URL: https://${WALLET_DOMAIN:-packeta.ir}
      IPG_FRONTEND_URL: https://${PAY_DOMAIN:-pay.packeta.ir}
    volumes:
      - backend_uploads:/app/uploads

  # Packeta's own customer/admin web app. Not published to the host;
  # reachable only via nginx (packeta.ir).
  frontend:
    build:
      context: ./frontend
      args:
        # Browser-facing, baked in at build time — same-origin through
        # nginx's /api/ proxy, so no CORS involved here.
        VITE_API_URL: https://${WALLET_DOMAIN:-packeta.ir}/api
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      - backend

  # The sandbox IPG's own pay page + Packeta's embeddable widgets. Not
  # published to the host; reachable only via nginx (pay.packeta.ir).
  ipg-frontend:
    build:
      context: ./ipg-frontend
      args:
        VITE_API_URL: https://${PAY_DOMAIN:-pay.packeta.ir}/api
        # Cross-origin from pay.packeta.ir to packeta.ir/api (phone+OTP
        # identification, wallet selection) — the Packeta backend already
        # calls app.enableCors() with no origin restriction.
        VITE_PACKETA_API_URL: https://${WALLET_DOMAIN:-packeta.ir}/api
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      - ipg-backend
      - backend

  # The only container reachable from outside — reverse-proxies both
  # domains to the containers above and terminates TLS. Config is rendered
  # from deploy/docker/nginx/templates/*.conf.template via the official
  # nginx image's envsubst-on-start step, using WALLET_DOMAIN/PAY_DOMAIN
  # below. See deploy/README.md for first-time cert issuance.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 64m
    # Not started by a plain `docker compose up` — only by the documented
    # production flow, which always names it explicitly (`docker compose up
    # -d nginx`, as deploy/docker/init-letsencrypt.sh does) or activates this
    # profile. That's what makes docker-compose.dev.yml's plain `up -d` skip
    # it automatically instead of needing --scale nginx=0 or similar.
    profiles: ['prod']
    depends_on:
      - frontend
      - ipg-frontend
      - backend
      - ipg-backend
    environment:
      WALLET_DOMAIN: ${WALLET_DOMAIN:-packeta.ir}
      PAY_DOMAIN: ${PAY_DOMAIN:-pay.packeta.ir}
    volumes:
      - ./deploy/docker/nginx/templates:/etc/nginx/templates:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    ports:
      - '80:80'
      - '443:443'

  # Not started by a plain `docker compose up` (see `profiles` below) —
  # invoked on demand for issuing/renewing certs. See
  # deploy/docker/init-letsencrypt.sh and deploy/README.md.
  certbot:
    image: certbot/certbot:latest
    profiles: ['certbot']
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot

volumes:
  postgres_data:
  ipg_postgres_data:
  mongo_data:
  backend_uploads:
