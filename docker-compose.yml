# Brings up the whole Packeta stack: two Postgres databases (Packeta's own
# backend, and the standalone sandbox IPG it calls out to), Mongo (Packeta's
# transaction-log store) with a mongo-express web UI in front of it, and all
# four apps (backend, ipg-backend, frontend, ipg-frontend). `docker compose
# up --build` is enough to get everything running with no manual .env setup
# — every value below already matches the various services' .env.example
# defaults for local/sandbox use.
#
# Four things worth knowing:
#   1. FRONTEND_URL / IPG_FRONTEND_URL (on backend and ipg-backend) and the
#      frontends' VITE_* build args are all built from PUBLIC_HOST (default
#      `localhost`) — they're used to build URLs the *customer's browser*
#      navigates to (redirects, widget mounts, etc.), not server-to-server
#      calls, so they have to be reachable from wherever the browser
#      actually runs, not necessarily this machine. Deploying to a real
#      server: set PUBLIC_HOST=<server-ip-or-domain> in a root .env file.
#      No domain yet? A bare IP works here too, just over plain HTTP — see
#      the security note below.
#   2. VITE_* values are baked into the frontend bundles at *build* time
#      (Vite inlines import.meta.env.VITE_*), so changing PUBLIC_HOST
#      requires a rebuild (`docker compose up --build`), not just a
#      container restart.
#   3. mongo-express (http://<PUBLIC_HOST>:8081, basic auth admin/admin by
#      default) is a browsing UI only — nothing writes through it. The
#      backend is still the only thing that writes to `packeta_logs`
#      (see MONGO_URI on the backend service below).
#   4. mem_limit on every service is sized for a small (~4GB RAM) box —
#      remove them (or raise the numbers) if you have more headroom.
#
# Real secrets (JWT_SECRET, a real ZARINPAL_MERCHANT_ID, mongo-express
# credentials, etc.) can be supplied via a .env file at the repo root — see
# the ${VAR:-default} fallbacks below — without editing this file. On any
# server reachable from the public internet, treat MONGO_EXPRESS_USERNAME/
# PASSWORD and JWT_SECRET as required, not optional: this compose file has
# no TLS/reverse-proxy in front of it, so until you put a domain + HTTPS
# in front of these ports, everything (including login credentials and OTP
# codes) travels as plain HTTP — fine for a private demo, not for real
# customer traffic.

services:
  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    mem_limit: 384m
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - max_connections=50
    environment:
      POSTGRES_USER: hesamtmg
      POSTGRES_PASSWORD: Tmg@2215309
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U packeta']
      interval: 5s
      timeout: 5s
      retries: 10

  ipg-postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    mem_limit: 256m
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
    environment:
      POSTGRES_USER: hesamtmg
      POSTGRES_PASSWORD: Tmg@2215309
      POSTGRES_DB: packeta_ipg
    volumes:
      - ipg_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ipg']
      interval: 5s
      timeout: 5s
      retries: 10

  # No host port published: nothing outside the docker network needs to
  # reach Mongo directly — the backend talks to it over the internal
  # network, and mongo-express (below) covers browsing it from a browser.
  # Publishing 27017 straight onto a public server's IP would put an
  # unauthenticated database port on the open internet.
  mongo:
    image: mongo:7
    restart: unless-stopped
    mem_limit: 384m
    command: ['mongod', '--wiredTigerCacheSizeGB', '0.25']
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand("ping")']
      interval: 5s
      timeout: 5s
      retries: 10

  # Web UI for browsing Mongo — mainly for the backend's `packeta_logs`
  # database (see MONGO_URI below), the one place its Mongo-side data
  # actually lives. Login is HTTP basic auth (defaults below); open
  # http://localhost:8081, then pick "packeta_logs" from the database list
  # once the backend has written at least one log entry.
  mongo-express:
    image: mongo-express:1-20-alpine3.19
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-admin}
    ports:
      - '8081:8081'

  # The standalone sandbox IPG — a real external-looking payment gateway
  # backend's PURCHASE/installment-repayment flow calls out to.
  ipg-backend:
    build:
      context: ./ipg-backend
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      ipg-postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: ipg-postgres
      DB_PORT: 5432
      DB_USERNAME: hesamtmg
      DB_PASSWORD: Tmg@2215309
      DB_DATABASE: packeta_ipg
      IPG_API_KEY: ${IPG_API_KEY:-sandbox-ipg-key}
      # Browser-facing (see header note) — where a merchant's charge
      # redirects the customer to pay.
      IPG_FRONTEND_URL: http://${PUBLIC_HOST:-localhost}:5174
    ports:
      - '4000:4000'

  # Packeta's own backend.
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: hesamtmg
      DB_PASSWORD: Tmg@2215309
      DB_DATABASE: postgres
      MONGO_URI: mongodb://mongo:27017/packeta_logs
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      # Server-to-server (purchase initiate/verify) — internal docker
      # network hostname is correct here, unlike the two below.
      IPG_BASE_URL: http://ipg-backend:4000
      IPG_API_KEY: ${IPG_API_KEY:-sandbox-ipg-key}
      # ZarinPal's public sandbox — settles no real money, accepts any
      # well-formed merchant id. Point both at production to go live.
      ZARINPAL_BASE_URL: ${ZARINPAL_BASE_URL:-https://sandbox.zarinpal.com}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx}
      # Browser-facing (see header note).
      FRONTEND_URL: http://${PUBLIC_HOST:-localhost}:5173
      IPG_FRONTEND_URL: http://${PUBLIC_HOST:-localhost}:5174
    ports:
      - '3000:3000'
    volumes:
      - backend_uploads:/app/uploads

  # Packeta's own customer/admin web app.
  frontend:
    build:
      context: ./frontend
      args:
        # Browser-facing (see header note) — baked in at build time.
        VITE_API_URL: http://${PUBLIC_HOST:-localhost}:3000
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      - backend
    ports:
      - '5173:5173'

  # The sandbox IPG's own pay page + Packeta's embeddable widgets.
  ipg-frontend:
    build:
      context: ./ipg-frontend
      args:
        VITE_API_URL: http://${PUBLIC_HOST:-localhost}:4000
        VITE_PACKETA_API_URL: http://${PUBLIC_HOST:-localhost}:3000
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      - ipg-backend
      - backend
    ports:
      - '5174:5174'

volumes:
  postgres_data:
  ipg_postgres_data:
  mongo_data:
  backend_uploads:
