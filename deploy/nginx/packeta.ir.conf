# Wallet app (frontend) + its backend, at packeta.ir
#
# - packeta.ir            -> frontend/dist (static, Vue history-mode SPA)
# - packeta.ir/api/*       -> backend, proxied to 127.0.0.1:3000/* (prefix stripped)
# - packeta.ir/api/uploads -> backend's own /uploads static route (avatars etc.)
#
# The backend has no built-in "/api" prefix (see backend/src/main.ts) — the
# leading /api here exists only in nginx, which strips it before proxying.
# The frontend must be built with VITE_API_URL=https://packeta.ir/api so its
# same-origin requests land on this block (see deploy/README.md).

server {
    listen 80;
    listen [::]:80;
    server_name packeta.ir www.packeta.ir;

    # Required for certbot's HTTP-01 challenge; everything else redirects to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name packeta.ir www.packeta.ir;

    ssl_certificate     /etc/letsencrypt/live/packeta.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/packeta.ir/privkey.pem;

    root /var/www/packeta/frontend;
    index index.html;

    # Avatar uploads and Excel batch imports go through here.
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed, immutable Vite build assets — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vue-router history mode: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
