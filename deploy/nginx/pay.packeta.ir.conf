# IPG pay page (ipg-frontend) + its backend, at pay.packeta.ir
#
# - pay.packeta.ir           -> ipg-frontend/dist (static, Vue history-mode SPA)
# - pay.packeta.ir/api/*      -> ipg-backend, proxied to 127.0.0.1:4000/* (prefix stripped)
#
# ipg-frontend also calls Packeta's own backend directly (phone+OTP
# identification, wallet selection on a merchant-initiated charge) — build it
# with VITE_PACKETA_API_URL=https://packeta.ir/api. That's a cross-origin
# call from pay.packeta.ir, which is fine: the Packeta backend already calls
# app.enableCors() (see backend/src/main.ts).

server {
    listen 80;
    listen [::]:80;
    server_name pay.packeta.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pay.packeta.ir;

    ssl_certificate     /etc/letsencrypt/live/pay.packeta.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay.packeta.ir/privkey.pem;

    root /var/www/packeta/ipg-frontend;
    index index.html;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
